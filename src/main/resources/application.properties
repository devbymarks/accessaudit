spring.application.name=AccessAudit
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/accessaudit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:accessaudit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:accessaudit_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
